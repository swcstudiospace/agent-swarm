name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - name: install pytest
        run: python3 -m pip install pytest ruff
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python3 -m pytest
      - name: build_agents check
        run: python3 scripts/build_agents.py --check
      - name: build_trae_agents check
        run: python3 scripts/build_trae_agents.py --check
      - name: root TS suite
        run: bun test tests/ts
      - name: omp package suite
        working-directory: omp
        run: bun run test
