name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every job runs on the Omega CI runner pool, never on GitHub-hosted runners
    # (docs: swcstudiospace/Omega-Prime docs/ci-runners.md). Fork pull requests are
    # skipped instead of queuing: the pool only takes this organisation's own code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    # The full suite takes about 65-70 minutes (64 min on GitHub-hosted, 69 min on the pool). Bound it well
    # above that, so a stuck test fails the job instead of holding a pool slot for GitHub's 6-hour default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      # The pool's tool cache is read-only, so a plain `pip install` falls back to the user site
      # (~/.local). tests/conftest.py points HOME at a temp dir for every test, so the scripts the tests
      # spawn with sys.executable could not see pytest, PyYAML or cryptography there (149 failures on main).
      # A venv keeps the packages next to the interpreter, whatever HOME is.
      - name: install test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest ruff pyyaml cryptography
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python3 -m pytest
      - name: build_agents check
        run: python3 scripts/build_agents.py --check
      - name: tool registry
        run: python3 -m swarm.tool_registry check
      - name: tool docs drift
        run: python3 -m swarm.tool_registry docs --check
      - name: tool contract tests drift
        run: python3 -m swarm.tool_registry gen-tests --check
      - name: skill registry
        run: python3 -m swarm.skill_registry check
      - name: skill docs drift
        run: python3 -m swarm.skill_registry docs --check
      - name: registry intake dry check
        run: python3 scripts/_registry_intake.py --check
      - name: root TS suite
        run: bun test tests/ts
      - name: omp package suite
        working-directory: omp
        run: bun run test
