repos:
  - repo: local
    hooks:
      - id: swarm-tool-registry
        name: Swarm tool registry
        entry: python3 -m swarm.tool_registry check
        language: system
        pass_filenames: false
        always_run: true
      - id: swarm-tool-docs
        name: Swarm tool documentation drift
        entry: python3 -m swarm.tool_registry docs --check
        language: system
        pass_filenames: false
        always_run: true
      - id: swarm-tool-contract-tests
        name: Swarm tool contract test drift
        entry: python3 -m swarm.tool_registry gen-tests --check
        language: system
        pass_filenames: false
        always_run: true
      - id: swarm-skill-registry
        name: Swarm skill registry
        entry: python3 -m swarm.skill_registry check
        language: system
        pass_filenames: false
        always_run: true
      - id: swarm-skill-docs
        name: Swarm skill documentation drift
        entry: python3 -m swarm.skill_registry docs --check
        language: system
        pass_filenames: false
        always_run: true
      - id: swarm-registry-intake
        name: Swarm registry intake dry check
        entry: python3 scripts/_registry_intake.py --check
        language: system
        pass_filenames: false
        always_run: true
